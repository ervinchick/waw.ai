<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAW — Wawid Studios</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app" id="app">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <span class="brand-mark"><span class="brand-dot"></span></span>
        <span class="brand-name">WAW</span>
      </div>
      <button class="icon-btn" id="closeSidebarBtn" aria-label="Скрыть панель" title="Скрыть панель">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span>Новый чат</span>
    </button>

    <div class="chat-list" id="chatList"></div>

    <div class="sidebar-bottom">
      <button class="profile-btn" id="settingsBtn">
        <span class="avatar" id="userAvatar">Т</span>
        <span class="profile-info">
          <span class="profile-name" id="userDisplayName">Ты</span>
          <span class="profile-sub">настройки и персонализация</span>
        </span>
        <svg class="gear" viewBox="0 0 24 24">
          <path d="M12 15.5a3.5 3.5 0 100-7 3.5 3.5 0 000 7z"/>
          <path d="M19.4 13a7.6 7.6 0 000-2l2-1.6-2-3.4-2.4 1a7.7 7.7 0 00-1.7-1L14.8 3H9.2l-.5 2.6a7.7 7.7 0 00-1.7 1l-2.4-1-2 3.4L4.6 11a7.6 7.6 0 000 2l-2 1.6 2 3.4 2.4-1a7.7 7.7 0 001.7 1l.5 2.6h5.6l.5-2.6a7.7 7.7 0 001.7-1l2.4 1 2-3.4-2-1.6z"/>
        </svg>
      </button>
    </div>
  </aside>

  <div class="sidebar-scrim" id="sidebarScrim"></div>

  <!-- ============ MAIN ============ -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="openSidebarBtn" aria-label="Открыть панель">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="topbar-title" id="topbarTitle">Чат 1</div>
      <button class="icon-btn" id="deleteChatBtn" title="Удалить чат" aria-label="Удалить чат">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13a1 1 0 001 1h6a1 1 0 001-1l1-13"/></svg>
      </button>
    </header>

    <section class="thread" id="thread">
      <div class="empty-state" id="emptyState">
        <div class="empty-mark"><span class="brand-dot big"></span></div>
        <h1>чем помочь?</h1>
        <p>Напиши сообщение внизу — WAW ответит здесь. Можно включить «рассуждения», чтобы видеть короткое обоснование перед ответом.</p>
      </div>
      <div class="messages" id="messages"></div>
    </section>

    <!-- ============ INPUT BAR ============ -->
    <div class="composer-wrap">
      <div class="composer" id="composer">
        <div class="composer-row">
          <button class="pill-toggle" id="reasoningToggle" aria-pressed="false" title="Показывать краткое рассуждение перед ответом">
            <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 00-4 12.7V17a2 2 0 002 2h4a2 2 0 002-2v-2.3A7 7 0 0012 2z"/><path d="M9.5 21h5"/></svg>
            <span>Рассуждения</span>
          </button>

          <button class="pill-toggle" id="roleplayToggle" aria-pressed="false" title="Более живой, образный стиль ответов">
            <svg viewBox="0 0 24 24"><path d="M8 12a4 4 0 118 0 4 4 0 01-8 0z"/><path d="M4 20c0-3 3.6-5 8-5s8 2 8 5"/></svg>
            <span>Roleplay</span>
          </button>
        </div>

        <div class="input-row">
          <textarea id="messageInput" rows="1" placeholder="Напиши WAW..." maxlength="4000"></textarea>
          <button class="send-btn" id="sendBtn" aria-label="Отправить" disabled>
            <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>
      <div class="composer-hint">WAW может ошибаться. Проверяй важные факты.</div>
    </div>
  </main>
</div>

<!-- ============ SETTINGS PANEL ============ -->
<div class="settings-scrim" id="settingsScrim"></div>
<aside class="settings-panel" id="settingsPanel" aria-hidden="true">
  <div class="settings-header">
    <h2>Настройки</h2>
    <button class="icon-btn" id="closeSettingsBtn" aria-label="Закрыть">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div class="settings-body">

    <section class="settings-section">
      <h3>Персонализация</h3>
      <label class="field">
        <span class="field-label">Как к тебе обращаться</span>
        <input type="text" id="displayNameInput" placeholder="Ты" maxlength="30">
      </label>
      <label class="field">
        <span class="field-label">Персональная инструкция</span>
        <span class="field-hint">Как WAW должен общаться лично с тобой. Например: «отвечай короче и без лишних вступлений».</span>
        <textarea id="personalInstructionInput" rows="4" maxlength="2000" placeholder="Например: отвечай кратко, чаще используй списки..."></textarea>
        <span class="field-counter"><span id="piCount">0</span>/2000</span>
      </label>
    </section>

    <section class="settings-section">
      <h3>Внешний вид</h3>
      <label class="field">
        <span class="field-label">Тема</span>
        <div class="segmented" id="themeSegmented" role="tablist">
          <button type="button" data-theme="dark" role="tab">Тёмная</button>
          <button type="button" data-theme="light" role="tab">Светлая</button>
        </div>
      </label>
      <label class="field">
        <span class="field-label">Акцентный цвет</span>
        <div class="swatch-row" id="accentSwatches">
          <button class="swatch" data-accent="violet" style="--sw:#8B6BFF" aria-label="Фиолетовый"></button>
          <button class="swatch" data-accent="magenta" style="--sw:#C266E0" aria-label="Пурпурный"></button>
          <button class="swatch" data-accent="indigo" style="--sw:#6E7BFF" aria-label="Индиго"></button>
          <button class="swatch" data-accent="rose" style="--sw:#E06691" aria-label="Розовый"></button>
        </div>
      </label>
    </section>

    <section class="settings-section">
      <h3>Поведение</h3>
      <label class="field row">
        <span>
          <span class="field-label">Рассуждения по умолчанию</span>
          <span class="field-hint">Показывать краткое обоснование перед ответом</span>
        </span>
        <button class="switch" id="reasoningDefaultSwitch" role="switch" aria-checked="false"><span class="switch-knob"></span></button>
      </label>
      <label class="field row">
        <span>
          <span class="field-label">Roleplay по умолчанию</span>
          <span class="field-hint">Более живой, образный стиль ответов</span>
        </span>
        <button class="switch" id="roleplayDefaultSwitch" role="switch" aria-checked="false"><span class="switch-knob"></span></button>
      </label>
    </section>

    <section class="settings-section danger-zone">
      <h3>Данные</h3>
      <button class="danger-btn" id="wipeDataBtn">Удалить все чаты и настройки</button>
    </section>

  </div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="script.js"></script>
</body>
</html>
